name: Build Kernel no release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch to build"
        required: true
        default: "stable-beta"
      variant:
        description: "Build variant (oplus = OPLUS Port ROM build, CONFIG_OPLUS_PORT=y, zip carries OPLUS_BUILD)"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - oplus

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Kernel Source
        run: |
          git clone \
            --recursive \
            --depth=1 \
            -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/dumpcode404/xiaomi_sm8250_kernel_e404_fork.git kernel

      - name: Debug
        run: |
          cd kernel

          echo "Current branch:"
          git rev-parse --abbrev-ref HEAD

          echo
          echo "Defconfig list:"
          ls arch/arm64/configs/vendor | grep munch || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            dwarves \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            zstd \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download Neutron Clang
        run: |
          wget -O clang.tar.zst \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst

          mkdir -p clang
          tar --zstd -xf clang.tar.zst -C clang

          echo "=== TOOLCHAIN STRUCTURE ==="
          find clang | head -50

      - name: Setup Toolchain
        run: |
          CLANG_DIR=$(find $GITHUB_WORKSPACE/clang -type d -name bin | head -1)

          echo "CLANG_DIR=$CLANG_DIR"

          export PATH=$CLANG_DIR:$PATH

          which clang
          clang --version

          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Setup KernelSU
        working-directory: kernel
        run: |
          set -eu
          echo "=== Setup KernelSU ==="

          # Driver branch of re-noroi/KernelSU, locked to one commit. A git SHA covers
          # the whole tree and history; the branch is never followed. If the branch is
          # moved or rewritten later, the commit is fetched by its SHA.
          KSU_REPO=https://github.com/re-noroi/KernelSU
          KSU_BRANCH=xxksu-driver
          KSU_SHA=037e828945e082ddab83a0266f1ed8315e4386fd
          git clone --single-branch --branch "$KSU_BRANCH" "$KSU_REPO" KernelSU
          if ! git -C KernelSU cat-file -e "${KSU_SHA}^{commit}" 2>/dev/null; then
            git -C KernelSU fetch origin "$KSU_SHA"
          fi
          git -C KernelSU checkout --detach "$KSU_SHA"
          KSU_HEAD="$(git -C KernelSU rev-parse HEAD)"
          if [ "$KSU_HEAD" != "$KSU_SHA" ]; then
            echo "::error::KernelSU HEAD $KSU_HEAD does not match the pinned $KSU_SHA"
            exit 1
          fi
          echo "KernelSU pinned at $KSU_HEAD"

          # Same steps as upstream kernel/setup.sh
          if [ -e drivers/kernelsu ] && [ ! -L drivers/kernelsu ]; then
            echo "::error::drivers/kernelsu already exists in the tree"
            exit 1
          fi
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "=== Verify KernelSU ==="
          grep -R "KernelSU" -n drivers 2>/dev/null | head || true

      - name: Build Kernel
        working-directory: kernel
        env:
          VARIANT: ${{ github.event.inputs.variant }}
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          if [ "$VARIANT" = "oplus" ]; then
            make O=out vendor/munch_defconfig vendor/oplus.config
          else
            make O=out vendor/munch_defconfig
          fi

          make -j$(nproc) \
            O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      - name: Verify Debug Artifacts
        working-directory: kernel
        env:
          VARIANT: ${{ github.event.inputs.variant }}
        run: |
          set -euo pipefail

          # OPLUS variant: all three symbols must be =y AND all three objects must have been built.
          # (A =y OPLUS_PORT alone is not enough: that once passed while two objects were missing.)
          if [ "$VARIANT" = "oplus" ]; then
            fail=0
            for sym in CONFIG_OPLUS_PORT CONFIG_OPLUS_OPROJECT CONFIG_OPLUS_STUB_NODES; do
              if ! grep -q "^${sym}=y$" out/.config; then
                echo "::error::variant=oplus: ${sym} is not =y in out/.config"
                fail=1
              fi
            done
            for obj in oplus_project.o oemports10t.o oplus_stub_nodes.o; do
              if [ ! -s "out/drivers/oplus/${obj}" ]; then
                echo "::error::variant=oplus: out/drivers/oplus/${obj} is missing or empty"
                fail=1
              fi
            done
            if [ "$fail" -ne 0 ]; then exit 1; fi
            ls -l out/drivers/oplus/*.o
            echo "oplus variant verified: 3 symbols =y and 3 objects built"
          else
            if grep -qE '^CONFIG_OPLUS_(PORT|OPROJECT|STUB_NODES)=y$' out/.config; then
              echo "::error::standard variant must not enable any CONFIG_OPLUS_* symbol"
              exit 1
            fi
            for obj in oplus_project.o oemports10t.o oplus_stub_nodes.o; do
              if [ -e "out/drivers/oplus/${obj}" ]; then
                echo "::error::standard variant must not build out/drivers/oplus/${obj}"
                exit 1
              fi
            done
            echo "standard variant verified: no OPLUS symbol or object"
          fi

          test -s out/vmlinux
          test -s out/System.map
          test -s out/.config
          test -s out/arch/arm64/boot/Image

          grep -q '^CONFIG_KALLSYMS=y$'                 out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$'             out/.config
          grep -q '^CONFIG_KALLSYMS_BASE_RELATIVE=y$'   out/.config
          grep -q '^CONFIG_DEBUG_KERNEL=y$'             out/.config
          grep -q '^CONFIG_DEBUG_INFO=y$'               out/.config
          grep -q '^CONFIG_FRAME_POINTER=y$'            out/.config
          grep -q '^CONFIG_ARCH_WANT_FRAME_POINTERS=y$' out/.config
          grep -q '^CONFIG_RANDOMIZE_BASE=y$'           out/.config
          ! grep -q '^CONFIG_DEBUG_INFO_REDUCED=y$'     out/.config
          ! grep -q '^CONFIG_DEBUG_INFO_SPLIT=y$'       out/.config

          # Dump tool output to files first: "producer | grep -q" would trip
          # pipefail through SIGPIPE as soon as grep exits on the first match.
          readelf -S out/vmlinux > "$RUNNER_TEMP/vmlinux.sections"
          grep -q '\.debug_info' "$RUNNER_TEMP/vmlinux.sections"

          nm out/vmlinux > "$RUNNER_TEMP/vmlinux.nm"
          grep -q ' kallsyms_names$' "$RUNNER_TEMP/vmlinux.nm"

          grep -q ' _stext$' out/System.map

          echo "vmlinux, DWARF, kallsyms, System.map and config verified"
          du -h out/vmlinux out/System.map out/arch/arm64/boot/Image
          df -h .

      - name: Clone AnyKernel3
        run: |
          # dumpcode404 fork, pinned: branch oplus = kvsnr113 main + OPLUS Port support (OPLUS_BUILD guard)
          git clone https://github.com/dumpcode404/AnyKernel3.git AnyKernel3
          git -C AnyKernel3 checkout --detach 36dc1f9f1165bdb0a0fb5ac68983e313952efcd7

      - name: Package Kernel
        env:
          VARIANT: ${{ github.event.inputs.variant }}
        run: |
          TARGET=MUNCH

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/${TARGET}-Image
          cp kernel/out/arch/arm64/boot/dtb AnyKernel3/${TARGET}-dtb
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/${TARGET}-dtbo.img

          sed -i "s/devicename=.*/devicename=munch/" AnyKernel3/anykernel.sh

          cd AnyKernel3

          if [ "$VARIANT" = "oplus" ]; then
            touch OPLUS_BUILD
            ZIP_NAME="RE404-POCO_F4-OPLUS-$(date +%y%m%d-%H%M).zip"
            zip -r9 "../${ZIP_NAME}" META-INF tools MUNCH-* anykernel.sh OPLUS_BUILD
          else
            ZIP_NAME="RE404-POCO_F4-Fork-$(date +%y%m%d-%H%M).zip"
            zip -r9 "../${ZIP_NAME}" META-INF tools MUNCH-* anykernel.sh
          fi

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Verify ZIP
        run: |
          echo "Current dir:"
          pwd
          echo
          echo "ZIP files:"
          find . -name "*.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E404-Kernel
          path: RE404-*.zip

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: E404-Kernel-debug
          path: |
            kernel/out/vmlinux
            kernel/out/System.map
            kernel/out/.config
            kernel/out/arch/arm64/boot/Image
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          
