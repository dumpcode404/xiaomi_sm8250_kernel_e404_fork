name: E404 Kernel CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          git \
          libelf-dev \
          libssl-dev \
          lld \
          llvm \
          rsync \
          unzip \
          zip \
          zstd \
          wget

      - name: Download Neutron Clang
        run: |
          mkdir clang
          cd clang

          wget -q \
          https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst

          tar --zstd -xf neutron-clang-30072026.tar.zst

          echo "$PWD/neutron-clang/bin" >> $GITHUB_PATH

      - name: Verify Toolchain
        run: |
          clang --version
          ld.lld --version

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
          https://github.com/kvsnr113/AnyKernel3.git \
          AnyKernel3

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          make O=out vendor/munch_defconfig

          make -j$(nproc) O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

      - name: Package Zip
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/MUNCH-Image
          cp out/arch/arm64/boot/dtb AnyKernel3/MUNCH-dtb
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/MUNCH-dtbo.img

          cd AnyKernel3

          ZIPNAME=RE404-POCO_F4-BPF-${GITHUB_RUN_NUMBER}.zip

          zip -r9 ../$ZIPNAME \
            META-INF \
            tools \
            anykernel.sh \
            MUNCH-Image \
            MUNCH-dtb \
            MUNCH-dtbo.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E404-Kernel
          path: RE404-POCO_F4-BPF-*.zip

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: out
