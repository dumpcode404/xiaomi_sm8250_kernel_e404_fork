name: Build E404 Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch to build"
        required: true
        default: "rebase-bpf"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Kernel Source
        run: |
          git clone \
            --recursive \
            --depth=1 \
            -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/dumpcode404/xiaomi_sm8250_kernel_e404_fork.git kernel

      - name: Debug
        run: |
          cd kernel

          echo "Current branch:"
          git rev-parse --abbrev-ref HEAD

          echo
          echo "Defconfig list:"
          ls arch/arm64/configs/vendor | grep munch || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libssl-dev \
            lld \
            python3 \
            zstd \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download Neutron Clang
        run: |
          wget -O clang.tar.zst \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst

          mkdir -p clang
          tar --zstd -xf clang.tar.zst -C clang

          echo "=== TOOLCHAIN STRUCTURE ==="
          find clang | head -50

      - name: Setup Toolchain
        run: |
          CLANG_DIR=$(find $GITHUB_WORKSPACE/clang -type d -name bin | head -1)

          echo "CLANG_DIR=$CLANG_DIR"

          export PATH=$CLANG_DIR:$PATH

          which clang
         